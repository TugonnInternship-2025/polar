{% extends "base.html" %}

{% block content %}
<h2>Forgot Password</h2>

<p>Enter your email address to reset your password:</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send Reset Email</button>
</form>

<a href="{% url 'account_login' %}">Back to login</a>
{% endblock %}
